name: Update nationwide EV subsidy data

on:
  schedule:
    # Retry hourly from 07:35 through 18:35 Asia/Seoul.
    # After today's official snapshot succeeds, later retries are skipped.
    - cron: "35 22-23,0-9 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nationwide-subsidy-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Sync latest main branch
        run: git pull --ff-only origin main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check whether today's subsidy data was already verified
        id: daily
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          should_run = True
          checked_at = None
          if os.environ.get("EVENT_NAME") == "schedule":
              data = json.loads(Path("version.json").read_text(encoding="utf-8"))
              checked_at = data.get("subsidyCheckedAt")
              if checked_at:
                  checked_date = datetime.fromisoformat(checked_at).astimezone(
                      ZoneInfo("Asia/Seoul")
                  ).date()
                  should_run = checked_date < datetime.now(
                      ZoneInfo("Asia/Seoul")
                  ).date()

          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"should_run={'true' if should_run else 'false'}\n")
          print(f"Subsidy daily check: previous={checked_at or 'none'}, should_run={should_run}")
          PY

      - name: Install HTML parser
        if: steps.daily.outputs.should_run == 'true'
        run: python -m pip install --disable-pip-version-check lxml==6.0.2

      - name: Render official EV portal pages
        if: steps.daily.outputs.should_run == 'true'
        run: |
          PAYMENT_URL="https://ev.or.kr/nportal/buySupprt/initSubsidyPaymentCheckAction.do"
          PRICE_URL="https://ev.or.kr/nportal/buySupprt/initPsLocalCarPirceAction.do"
          MODEL_URL="https://ev.or.kr/nportal/buySupprt/psPopupLocalCarModelPrice.do?year=2026&local_cd=1100&local_nm=%EC%84%9C%EC%9A%B8%ED%8A%B9%EB%B3%84%EC%8B%9C&car_type=11"
          render_page() {
            local url="$1"
            local output="$2"
            for attempt in 1 2 3; do
              if timeout 70s google-chrome --headless=new --no-sandbox --disable-gpu \
                --no-first-run --user-data-dir="/tmp/subsidy-chrome-${attempt}-$RANDOM" \
                --virtual-time-budget=12000 --dump-dom "$url" > "$output" && \
                grep -Eq "무공해차|전기자동차" "$output"; then
                return 0
              fi
              echo "Official page render retry ${attempt}/3"
              sleep $((attempt * 3))
            done
            return 1
          }
          render_page "$PAYMENT_URL" /tmp/subsidy-payment.html
          render_page "$PRICE_URL" /tmp/subsidy-price.html
          render_page "$MODEL_URL" /tmp/subsidy-model.html

      - name: Build and validate nationwide subsidy snapshot
        if: steps.daily.outputs.should_run == 'true'
        run: |
          python scripts/update_subsidy_data.py \
            --payment-html /tmp/subsidy-payment.html \
            --price-html /tmp/subsidy-price.html \
            --model-html /tmp/subsidy-model.html \
            --output subsidy-data.json
          python - <<'PY'
          import json
          data = json.load(open("subsidy-data.json", encoding="utf-8"))
          assert len(data["regions"]) >= 150
          assert data["regions"][0]["sido"] == "서울특별시"
          print(f"Validated {len(data['regions'])} official regions")
          PY

      - name: Publish daily subsidy check
        if: steps.daily.outputs.should_run == 'true'
        run: |
          CHECKED_AT="$(python -c "import json; print(json.load(open('subsidy-data.json', encoding='utf-8'))['checkedAt'])")"
          git config user.name "ES90 Subsidy Auto Update"
          git config user.email "actions@users.noreply.github.com"

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            python scripts/update_subsidy_data.py \
              --payment-html /tmp/subsidy-payment.html \
              --price-html /tmp/subsidy-price.html \
              --model-html /tmp/subsidy-model.html \
              --output subsidy-data.json
            CHECKED_AT="$(python -c "import json; print(json.load(open('subsidy-data.json', encoding='utf-8'))['checkedAt'])")"
            python scripts/update_version_metadata.py --subsidy-checked-at "$CHECKED_AT"
            git add subsidy-data.json version.json
            git commit -m "Update nationwide EV subsidy snapshot"
            if git push; then
              exit 0
            fi
            echo "Subsidy update raced with another workflow (attempt ${attempt}/5)."
            sleep $((attempt * 2))
          done

          echo "Unable to publish subsidy snapshot after 5 attempts." >&2
          exit 1
