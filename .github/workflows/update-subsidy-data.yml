name: Update nationwide EV subsidy data

on:
  schedule:
    # Refresh hourly from 07:35 through 18:35 Asia/Seoul so that
    # same-day changes published by the official portal are propagated.
    - cron: "35 22-23,0-9 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nationwide-subsidy-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Sync latest main branch
        run: git pull --ff-only origin main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install browser and HTML parsers
        run: python -m pip install --disable-pip-version-check lxml==6.0.2 selenium==4.38.0

      - name: Render official EV portal pages
        run: |
          python scripts/render_subsidy_pages.py \
            --payment-output /tmp/subsidy-payment.html \
            --price-output /tmp/subsidy-price.html \
            --model-output /tmp/subsidy-model.html

      - name: Build and validate nationwide subsidy snapshot
        run: |
          python scripts/update_subsidy_data.py \
            --payment-html /tmp/subsidy-payment.html \
            --price-html /tmp/subsidy-price.html \
            --model-html /tmp/subsidy-model.html \
            --output subsidy-data.json
          python - <<'PY'
          import json
          data = json.load(open("subsidy-data.json", encoding="utf-8"))
          assert len(data["regions"]) >= 150
          assert data["regions"][0]["sido"] == "서울특별시"
          assert data["allocationBasis"] == "일반 승용"
          assert all(
              region["remaining"]
              == max(0, region["announced"] - region["delivered"])
              for region in data["regions"]
          )
          print(f"Validated {len(data['regions'])} official regions")
          PY

      - name: Publish subsidy snapshot
        run: |
          CHECKED_AT="$(python -c "import json; print(json.load(open('subsidy-data.json', encoding='utf-8'))['checkedAt'])")"
          git config user.name "ES90 Subsidy Auto Update"
          git config user.email "actions@users.noreply.github.com"

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            python scripts/update_subsidy_data.py \
              --payment-html /tmp/subsidy-payment.html \
              --price-html /tmp/subsidy-price.html \
              --model-html /tmp/subsidy-model.html \
              --output subsidy-data.json
            CHECKED_AT="$(python -c "import json; print(json.load(open('subsidy-data.json', encoding='utf-8'))['checkedAt'])")"
            python scripts/update_version_metadata.py --subsidy-checked-at "$CHECKED_AT"
            git add subsidy-data.json version.json
            git commit -m "Update nationwide EV subsidy snapshot"
            if git push; then
              exit 0
            fi
            echo "Subsidy update raced with another workflow (attempt ${attempt}/5)."
            sleep $((attempt * 2))
          done

          echo "Unable to publish subsidy snapshot after 5 attempts." >&2
          exit 1
