name: Update nationwide EV subsidy data

on:
  schedule:
    # Retry each three-hour slot away from the top-of-hour congestion window.
    # Asia/Seoul slots: 08:07/27/47, 11:07/27/47, 14:07/27/47, 17:07/27/47.
    # The slot guard below skips every retry after the first successful check.
    - cron: "7,27,47 23,2,5,8 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nationwide-subsidy-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Sync latest main branch
        run: git pull --ff-only origin main

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Check whether the latest three-hour subsidy slot was already verified
        id: slot
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          should_run = True
          checked_at = None
          required_slot = None
          if os.environ.get("EVENT_NAME") == "schedule":
              seoul = ZoneInfo("Asia/Seoul")
              now = datetime.now(seoul)
              slots = [
                  now.replace(hour=hour, minute=0, second=0, microsecond=0)
                  for hour in (8, 11, 14, 17)
              ]
              required_slot = max((slot for slot in slots if slot <= now), default=None)
              data = json.loads(Path("version.json").read_text(encoding="utf-8"))
              checked_at = data.get("subsidyCheckedAt")
              checked_time = (
                  datetime.fromisoformat(checked_at).astimezone(seoul)
                  if checked_at
                  else None
              )
              should_run = required_slot is not None and (
                  checked_time is None or checked_time < required_slot
              )

          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"should_run={'true' if should_run else 'false'}\n")
          print(
              f"Subsidy slot check: required={required_slot or 'manual'}, "
              f"previous={checked_at or 'none'}, "
              f"should_run={should_run}"
          )
          PY

      - name: Install browser and HTML parsers
        if: steps.slot.outputs.should_run == 'true'
        run: python -m pip install --disable-pip-version-check lxml==6.0.2 selenium==4.38.0

      - name: Render official EV portal pages
        if: steps.slot.outputs.should_run == 'true'
        run: |
          python scripts/render_subsidy_pages.py \
            --payment-output /tmp/subsidy-payment.html \
            --price-output /tmp/subsidy-price.html \
            --model-output /tmp/subsidy-model.html

      - name: Build and validate nationwide subsidy snapshot
        if: steps.slot.outputs.should_run == 'true'
        run: |
          python scripts/update_subsidy_data.py \
            --payment-html /tmp/subsidy-payment.html \
            --price-html /tmp/subsidy-price.html \
            --model-html /tmp/subsidy-model.html \
            --output subsidy-data.json
          python - <<'PY'
          import json
          data = json.load(open("subsidy-data.json", encoding="utf-8"))
          assert len(data["regions"]) >= 150
          assert data["regions"][0]["sido"] == "서울특별시"
          assert data["allocationBasis"] == "전기승용 전체"
          assert all(
              all(field in region for field in (
                  "announced", "received", "selected", "delivered",
                  "selectionRemaining", "remaining",
              ))
              for region in data["regions"]
          )
          assert data["collection"]["payment"] == "live-official"
          assert all(
              region["remaining"]
              == max(0, region["announced"] - region["delivered"])
              for region in data["regions"]
          )
          key_regions = {
              "서울특별시", "부산광역시", "대구광역시", "인천광역시",
              "광주광역시", "대전광역시", "울산광역시", "세종특별자치시",
          }
          assert all(
              region["combinedMaxManwon"] > 0
              for region in data["regions"]
              if region["sido"] in key_regions
          )
          print(f"Validated {len(data['regions'])} official regions")
          PY

      - name: Publish subsidy snapshot
        if: steps.slot.outputs.should_run == 'true'
        run: |
          CHECKED_AT="$(python -c "import json; print(json.load(open('subsidy-data.json', encoding='utf-8'))['checkedAt'])")"
          git config user.name "ES90 Subsidy Auto Update"
          git config user.email "actions@users.noreply.github.com"

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            python scripts/update_subsidy_data.py \
              --payment-html /tmp/subsidy-payment.html \
              --price-html /tmp/subsidy-price.html \
              --model-html /tmp/subsidy-model.html \
              --output subsidy-data.json
            CHECKED_AT="$(python -c "import json; print(json.load(open('subsidy-data.json', encoding='utf-8'))['checkedAt'])")"
            python scripts/update_version_metadata.py --subsidy-checked-at "$CHECKED_AT"
            git add subsidy-data.json version.json
            git commit -m "Update nationwide EV subsidy snapshot"
            if git push; then
              exit 0
            fi
            echo "Subsidy update raced with another workflow (attempt ${attempt}/5)."
            sleep $((attempt * 2))
          done

          echo "Unable to publish subsidy snapshot after 5 attempts." >&2
          exit 1

      - name: Upload subsidy diagnostics on failure
        if: failure() && steps.slot.outputs.should_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: subsidy-render-diagnostics-${{ github.run_id }}
          path: |
            /tmp/subsidy-payment.html
            /tmp/subsidy-price.html
            /tmp/subsidy-model.html
            subsidy-data.json
          if-no-files-found: ignore
          retention-days: 7
