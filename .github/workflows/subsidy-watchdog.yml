name: Nationwide EV subsidy watchdog

on:
  schedule:
    # Check early in each hour after the primary :07 attempt. If GitHub's
    # scheduler missed it, recover the same hourly slot at :12, then retry
    # at :32 and :52 only while subsidyCheckedAt is still behind.
    - cron: "12,32,52 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    uses: ./.github/workflows/update-subsidy-data.yml
    with:
      check_required_slot: true
    secrets: inherit
