name: Update ES90 reservations

on:
  workflow_call:
    inputs:
      target_hour:
        description: Target reservation slot in Asia/Seoul; 0 selects the latest slot.
        required: false
        type: number
        default: 0
      check_required_slot:
        description: Skip collection when the requested slot is already complete.
        required: false
        type: boolean
        default: false
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: es90-reservation-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Sync latest main branch
        run: git pull --ff-only origin main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check whether the latest required slot is complete
        id: slot
        env:
          EVENT_NAME: ${{ github.event_name }}
          TARGET_HOUR: ${{ inputs.target_hour || 0 }}
          CHECK_REQUIRED_SLOT: ${{ inputs.check_required_slot || false }}
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          should_run = True
          target_slot = "manual"
          if os.environ.get("CHECK_REQUIRED_SLOT", "false").lower() == "true":
              now = datetime.now(ZoneInfo("Asia/Seoul"))
              state = json.loads(
                  Path("automation/es90-reservation-state.json").read_text(encoding="utf-8")
              )
              observed_at = datetime.fromisoformat(state["observedAt"])
              target_hours = (9, 12, 15, 18)
              requested_hour = int(os.environ.get("TARGET_HOUR", "0"))
              if requested_hour in target_hours:
                  latest_target = now.replace(
                      hour=requested_hour, minute=0, second=0, microsecond=0
                  )
                  if now < latest_target:
                      latest_target = None
              else:
                  eligible_targets = [
                      now.replace(hour=hour, minute=0, second=0, microsecond=0)
                      for hour in target_hours
                      if now.hour >= hour
                  ]
                  latest_target = max(eligible_targets, default=None)
              should_run = (
                  latest_target is not None
                  and observed_at < latest_target
              )
              target_slot = (
                  latest_target.isoformat(timespec="minutes")
                  if latest_target
                  else "before-first-slot"
              )

          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"should_run={'true' if should_run else 'false'}\n")
              output.write(f"target_slot={target_slot}\n")
          print(
              f"Reservation heartbeat: target={target_slot}, "
              f"should_run={should_run}"
          )
          PY

      - name: Install browser
        if: steps.slot.outputs.should_run == 'true'
        run: |
          python -m pip install --disable-pip-version-check playwright==1.54.0
          python -m playwright install --with-deps chromium

      - name: Read ES90 data from Daily Report
        if: steps.slot.outputs.should_run == 'true'
        env:
          VOLVO_SALES_ID: ${{ secrets.VOLVO_SALES_ID }}
          VOLVO_SALES_PASSWORD: ${{ secrets.VOLVO_SALES_PASSWORD }}
        run: python scripts/update_es90_reservations.py

      - name: Publish latest check
        if: steps.slot.outputs.should_run == 'true'
        run: |
          if git diff --quiet -- app.html automation/es90-reservation-state.json; then
            echo "No ES90 data or check-time changes."
            exit 0
          fi

          python - <<'PY'
          import json
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          path = Path("version.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          parts = data["version"].split(".")
          parts[-1] = str(int(parts[-1]) + 1)
          data["version"] = ".".join(parts)
          data["updatedAt"] = datetime.now(ZoneInfo("Asia/Seoul")).isoformat(timespec="seconds")
          state = json.loads(Path("automation/es90-reservation-state.json").read_text(encoding="utf-8"))
          data["reservationUpdatedAt"] = state["observedAt"]
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY

          git config user.name "ES90 Auto Update"
          git config user.email "actions@users.noreply.github.com"
          git add app.html automation/es90-reservation-state.json version.json
          git commit -m "Auto update ES90 reservations"

          for attempt in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push raced with another update; rebasing (attempt ${attempt}/5)."
            git pull --rebase -X theirs origin main
            sleep $((attempt * 2))
          done

          echo "Unable to publish ES90 reservation data after 5 attempts." >&2
          exit 1
