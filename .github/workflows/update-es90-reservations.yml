name: Update ES90 reservations

on:
  schedule:
    # Two independent 20-minute heartbeat registrations, interleaved to
    # check every 10 minutes from 09:07 through 23:57 Asia/Seoul.
    # Each heartbeat backfills the latest missing 09:00, 12:00, 15:00 or
    # 18:00 slot. Off-hour minutes avoid GitHub's top-of-hour congestion.
    - cron: "7,27,47 0-14 * * *"
    - cron: "17,37,57 0-14 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: es90-reservation-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Sync latest main branch
        run: git pull --ff-only origin main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check whether the latest required slot is complete
        id: slot
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          should_run = True
          target_slot = "manual"
          if os.environ["EVENT_NAME"] == "schedule":
              now = datetime.now(ZoneInfo("Asia/Seoul"))
              state = json.loads(
                  Path("automation/es90-reservation-state.json").read_text(encoding="utf-8")
              )
              observed_at = datetime.fromisoformat(state["observedAt"])
              target_hours = (9, 12, 15, 18)
              eligible_targets = [
                  now.replace(hour=hour, minute=0, second=0, microsecond=0)
                  for hour in target_hours
                  if now.hour >= hour
              ]
              latest_target = max(eligible_targets, default=None)
              should_run = (
                  latest_target is not None
                  and observed_at < latest_target
              )
              target_slot = (
                  latest_target.isoformat(timespec="minutes")
                  if latest_target
                  else "before-first-slot"
              )

          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"should_run={'true' if should_run else 'false'}\n")
              output.write(f"target_slot={target_slot}\n")
          print(
              f"Reservation heartbeat: target={target_slot}, "
              f"should_run={should_run}"
          )
          PY

      - name: Install browser
        if: steps.slot.outputs.should_run == 'true'
        run: |
          python -m pip install --disable-pip-version-check playwright==1.54.0
          python -m playwright install --with-deps chromium

      - name: Read ES90 data from Daily Report
        if: steps.slot.outputs.should_run == 'true'
        env:
          VOLVO_SALES_ID: ${{ secrets.VOLVO_SALES_ID }}
          VOLVO_SALES_PASSWORD: ${{ secrets.VOLVO_SALES_PASSWORD }}
        run: python scripts/update_es90_reservations.py

      - name: Publish latest check
        if: steps.slot.outputs.should_run == 'true'
        run: |
          if git diff --quiet -- app.html automation/es90-reservation-state.json; then
            echo "No ES90 data or check-time changes."
            exit 0
          fi

          python - <<'PY'
          import json
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          path = Path("version.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          parts = data["version"].split(".")
          parts[-1] = str(int(parts[-1]) + 1)
          data["version"] = ".".join(parts)
          data["updatedAt"] = datetime.now(ZoneInfo("Asia/Seoul")).isoformat(timespec="seconds")
          state = json.loads(Path("automation/es90-reservation-state.json").read_text(encoding="utf-8"))
          data["reservationUpdatedAt"] = state["observedAt"]
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY

          git config user.name "ES90 Auto Update"
          git config user.email "actions@users.noreply.github.com"
          git add app.html automation/es90-reservation-state.json version.json
          git commit -m "Auto update ES90 reservations"
          git push
