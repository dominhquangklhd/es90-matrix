name: Update Getcha competitor prices

on:
  push:
    paths:
      - ".github/workflows/update-getcha-prices.yml"
      - "scripts/update_getcha_prices.py"
  schedule:
    # Every Monday at 09:17 Asia/Seoul. Minute 17 avoids GitHub's hourly peak.
    - cron: "17 0 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: es90-data-write
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Sync latest main branch
        run: git pull --ff-only origin main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install browser
        run: |
          python -m pip install --disable-pip-version-check playwright==1.54.0
          python -m playwright install --with-deps chromium

      - name: Check exact Getcha trims and prices
        run: python scripts/update_getcha_prices.py

      - name: Publish weekly check
        run: |
          if git diff --quiet -- app.html automation/getcha-price-state.json; then
            echo "No Getcha date or price changes."
            exit 0
          fi

          python - <<'PY'
          import json
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          path = Path("version.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          parts = data["version"].split(".")
          parts[-1] = str(int(parts[-1]) + 1)
          data["version"] = ".".join(parts)
          data["updatedAt"] = datetime.now(
              ZoneInfo("Asia/Seoul")
          ).isoformat(timespec="seconds")
          path.write_text(
              json.dumps(data, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

          git config user.name "ES90 Auto Update"
          git config user.email "actions@users.noreply.github.com"
          git add app.html automation/getcha-price-state.json version.json
          git commit -m "Auto update Getcha competitor prices"
          git push
