name: Update Getcha competitor prices

on:
  schedule:
    # Retry hourly from 07:17 through 18:17 Asia/Seoul.
    # Once today's complete price check succeeds, later retries are skipped.
    - cron: "17 22-23,0-9 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: getcha-competitor-price-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Sync latest main branch
        run: git pull --ff-only origin main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check whether today's competitor prices were already verified
        id: daily
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          should_run = True
          checked_at = None
          if os.environ.get("EVENT_NAME") == "schedule":
              data = json.loads(Path("version.json").read_text(encoding="utf-8"))
              checked_at = data.get("competitorPriceCheckedAt")
              if checked_at:
                  checked_date = datetime.fromisoformat(checked_at).astimezone(
                      ZoneInfo("Asia/Seoul")
                  ).date()
                  should_run = checked_date < datetime.now(
                      ZoneInfo("Asia/Seoul")
                  ).date()

          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"should_run={'true' if should_run else 'false'}\n")
          print(
              f"Competitor price daily check: previous={checked_at or 'none'}, "
              f"should_run={should_run}"
          )
          PY

      - name: Install browser
        if: steps.daily.outputs.should_run == 'true'
        run: |
          python -m pip install --disable-pip-version-check playwright==1.54.0
          python -m playwright install --with-deps chromium

      - name: Check exact Getcha trims and prices
        if: steps.daily.outputs.should_run == 'true'
        run: python scripts/update_getcha_prices.py

      - name: Publish daily check
        if: steps.daily.outputs.should_run == 'true'
        run: |
          if git diff --quiet -- app.html automation/getcha-price-state.json; then
            echo "No Getcha date or price changes."
            exit 0
          fi

          COMPETITOR_PRICE_CHECKED_AT="$(
            python -c "import json; print(json.load(open('automation/getcha-price-state.json', encoding='utf-8'))['checkedAt'])"
          )"

          git config user.name "ES90 Auto Update"
          git config user.email "actions@users.noreply.github.com"
          git add app.html automation/getcha-price-state.json
          git commit -m "Auto update Getcha competitor prices"

          data_published=false
          for attempt in 1 2 3 4 5; do
            if git push; then
              data_published=true
              break
            fi
            echo "Push raced with another update; rebasing (attempt ${attempt}/5)."
            git pull --rebase -X theirs origin main
            sleep $((attempt * 2))
          done
          if [ "$data_published" != "true" ]; then
            echo "Unable to publish competitor prices after 5 attempts." >&2
            exit 1
          fi

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            python scripts/update_version_metadata.py \
              --competitor-price-checked-at "$COMPETITOR_PRICE_CHECKED_AT"
            git add version.json
            git commit -m "Record competitor price check time"
            if git push; then
              exit 0
            fi
            echo "Version metadata raced with another update (attempt ${attempt}/5)."
            sleep $((attempt * 2))
          done

          echo "Unable to publish competitor price check time after 5 attempts." >&2
          exit 1
