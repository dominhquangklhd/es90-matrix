name: Update 350kW charger data

on:
  push:
    paths:
      - ".github/workflows/update-charger-data.yml"
      - "scripts/update_charger_data.py"
  schedule:
    # Every day at 06:20 Asia/Seoul (21:20 UTC).
    - cron: "20 21 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: charger-data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch charger data from the Public Data Portal
        env:
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
        run: python scripts/update_charger_data.py

      - name: Publish changed charger data
        run: |
          if git diff --quiet -- charger-data-350kw.json; then
            echo "No charger data changes."
            exit 0
          fi

          python - <<'PY'
          import json
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          now = datetime.now(ZoneInfo("Asia/Seoul")).isoformat(timespec="seconds")
          path = Path("version.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          parts = data["version"].split(".")
          parts[-1] = str(int(parts[-1]) + 1)
          data["version"] = ".".join(parts)
          data["updatedAt"] = now
          data["chargerUpdatedAt"] = now
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY

          git config user.name "ES90 Charger Auto Update"
          git config user.email "actions@users.noreply.github.com"
          git add charger-data-350kw.json version.json
          git commit -m "Auto update 350kW charger data"
          git push
