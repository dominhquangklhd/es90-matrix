name: Update 350kW charger data

on:
  schedule:
    # Retry hourly from 06:20 through 11:20 Asia/Seoul.
    # Once today's check succeeds, later scheduled retries are skipped.
    - cron: "20 21-23,0-2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: charger-data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Sync latest main branch
        run: git pull --ff-only origin main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check whether today's map and charger data were already verified
        id: daily
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          should_run = True
          checked_at = None
          if os.environ.get("EVENT_NAME") == "schedule":
              data = json.loads(Path("version.json").read_text(encoding="utf-8"))
              checked_at = data.get("chargerCheckedAt")
              tmap_checked_at = data.get("tmapCheckedAt")
              today = datetime.now(ZoneInfo("Asia/Seoul")).date()
              if checked_at and tmap_checked_at:
                  checked_date = datetime.fromisoformat(checked_at).astimezone(
                      ZoneInfo("Asia/Seoul")
                  ).date()
                  tmap_checked_date = datetime.fromisoformat(
                      tmap_checked_at
                  ).astimezone(ZoneInfo("Asia/Seoul")).date()
                  should_run = checked_date < today or tmap_checked_date < today

          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"should_run={'true' if should_run else 'false'}\n")
          print(
              f"Charger daily check: previous={checked_at or 'none'}, "
              f"should_run={should_run}"
          )
          PY

      - name: Verify TMAP SDK and app key
        if: steps.daily.outputs.should_run == 'true'
        run: python scripts/check_tmap_api.py

      - name: Fetch charger data from the Public Data Portal
        if: steps.daily.outputs.should_run == 'true'
        env:
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
        run: python scripts/update_charger_data.py

      - name: Record check and publish changed charger data
        if: steps.daily.outputs.should_run == 'true'
        run: |
          if git diff --quiet -- charger-data-350kw.json; then
            CHARGER_DATA_CHANGED=false
            echo "No charger data changes."
          else
            CHARGER_DATA_CHANGED=true
            echo "Charger data changed."
          fi
          export CHARGER_DATA_CHANGED

          python - <<'PY'
          import json
          import os
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          now = datetime.now(ZoneInfo("Asia/Seoul")).isoformat(timespec="seconds")
          path = Path("version.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          parts = data["version"].split(".")
          parts[-1] = str(int(parts[-1]) + 1)
          data["version"] = ".".join(parts)
          data["updatedAt"] = now
          data["chargerCheckedAt"] = now
          data["tmapCheckedAt"] = now
          if os.environ["CHARGER_DATA_CHANGED"] == "true":
              data["chargerUpdatedAt"] = now
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY

          git config user.name "ES90 Charger Auto Update"
          git config user.email "actions@users.noreply.github.com"
          git add version.json
          if [ "$CHARGER_DATA_CHANGED" = "true" ]; then
            git add charger-data-350kw.json
          fi
          git commit -m "Daily check 350kW charger data"
          git push
