function cityCard(region){const announced=Number(region.announced)||0,rawSelected=Number(region.selected)||0,detail=region.selectionBreakdown||{},breakdownTotal=Number(detail.total),selected=Number.isFinite(breakdownTotal)?breakdownTotal:rawSelected,remaining=Math.max(0,announced-selected),burn=announced?Math.max(0,Math.min(100,selected/announced*100)):0,remain=announced?Math.max(0,Math.min(100,remaining/announced*100)):0,availability=remain<=0?{text:'마감완료',state:'closed'}:remain<5?{text:'마감임박',state:'closing'}:{text:'신청가능',state:'available'},deadline=region.applicationDeadline||'공고 확인',deadlineInfo=deadlineStatus(deadline),detailValue=key=>Number.isFinite(Number(detail[key]))?`${fmt(detail[key])}대`:'—',detailTotal=`${fmt(selected)}대`,burnFormula=`(= ${fmt(selected)} / ${fmt(announced)})`,remainFormula=`(= ${fmt(remaining)} / ${fmt(announced)})`;return `<article class="city-card"><div class="city-head"><div class="city-title-block"><div class="city-name-row"><div class="city-name">${esc(region.sido)}</div><span class="availability-badge ${availability.state}">${esc(availability.text)}</span></div><div class="deadline"><span>신청 마감 ${esc(deadline)}</span><span class="deadline-status ${deadlineInfo.state}">${esc(deadlineInfo.text)}</span></div></div><div class="city-head-tools">${cityMapSvg(region.sido)}</div></div><div class="city-main"><div class="donut-chart" style="--use-rate:${burn}"><div class="donut-center"><span>공고 대수</span><b>${fmt(announced)}</b></div></div><div class="donut-stats"><div class="donut-stat"><div class="donut-stat-copy"><span>소진율</span><small>${esc(burnFormula)}</small></div><b>${pct(burn)}</b></div><div class="donut-stat remaining"><div class="donut-stat-copy"><span>잔여율</span><small>${esc(remainFormula)}</small></div><b>${pct(remain)}</b></div></div></div><div class="counts selection-counts"><div class="count"><span>일반</span><b>${detailValue('general')}</b></div><div class="count"><span>우선순위</span><b>${detailValue('priority')}</b></div><div cla function renderCities(regions){document.getElementById('cityGrid').innerHTML=regions.map(cityCard).join('')}
function render(){const regions=orderedRegions();renderTrims(regions);renderCities(regions)}
async function refreshData(force=false){if(!force&&Date.now()-lastRefreshAt<15000)return;lastRefreshAt=Date.now();const stamp=Date.now(),[dataResponse,versionResponse]=await Promise.all([fetch(`./subsidy-data.json?ts=${stamp}`,{cache:'no-store'}),fetch(`./version.json?ts=${stamp}`,{cache:'no-store'})]);if(!dataResponse.ok)throw new Error('보조금 데이터를 불러오지 못했습니다.');subsidyData=await dataResponse.json();const version=versionResponse.ok?await versionResponse.json():{},candidates=[version.subsidyCheckedAt,subsidyData.checkedAt].filter(value=>!Number.isNaN(new Date(value).getTime())),checked=candidates.sort((a,b)=>new Date(b)-new Date(a))[0],matrixDate=formatMatrixDate(version.matrixUpdatedAt);document.getElementById('freshnessText').textContent=`${formatSeoulDate(checked)} 기준`;if(matrixDate)document.getElementById('matrixUpdatedDate').textContent=matrixDate;render()}
async function load(){keepAppSessionAlive();await refreshData(true);setInterval(()=>refreshData().catch(()=>{}),60000);addEventListener('focus',()=>refreshData(true).catch(()=>{}));document.addEventListener('visibilitychange',()=>{if(!document.hidden)refreshData(true).catch(()=>{})})}
load().catch(error=>{notice(error.message);document.getElementById('freshnessText').textContent='확인 필요'});
</script>
</body>
</html>
