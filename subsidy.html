<body>

<main>
  <section class="hero"><div class="kicker">NATIONWIDE EV SUBSIDY STATUS</div><h1>전국 전기차 보조금 현황</h1><p>고객 거주지역을 선택하면 현재 출고잔여 물량과 ES90 트림별 예상 보조금 및 구매가를 확인할 수 있습니다.</p><div class="freshness" title="보조금 데이터 업데이트 시각"><span class="freshness-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5" stroke-width="1.8"/><path d="M12 7.5V12l3.2 2" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span class="freshness-copy"><span class="freshness-label">UPDATE</span><span class="freshness-time" id="freshnessText">확인 중</span></span></div></section>

      <div class="field trim-field"><label id="trimSelectLabel">ES90 트림</label><select id="trimSelect" class="native-trim-select" aria-hidden="true" tabindex="-1"></select><div class="trim-picker" id="trimPicker"><button class="trim-picker-trigger" id="trimPickerTrigger" type="button" aria-haspopup="listbox" aria-expanded="false" aria-labelledby="trimSelectLabel trimPickerSelected"><span class="trim-picker-selected" id="trimPickerSelected"></span><span class="trim-picker-badge" id="trimPickerBadge" title="보조금 50% 적용" aria-label="보조금 50% 적용" hidden>50%</span></button><div class="trim-picker-menu" id="trimPickerMenu" role="listbox" aria-label="ES90 트림"></div></div></div>
      <button class="find" onclick="showSubsidy()">보조금 계산</button>
    </div>
  </section>
  <!-- 전국 요약 통계 영역은 표시하지 않음 -->

    <section class="panel"><div class="panel-head"><div class="panel-title">ES90 예상 구매가 시뮬레이션</div><div class="panel-note">예상 구매가 = 출고가 − 국비 − 지방비</div></div><div class="waterfall-wrap" id="waterfallWrap"></div></section>
    <section class="panel"><div class="panel-head"><div class="panel-title">선택지역 보조금 소진 현황</div><div class="panel-note">무공해차 통합누리집 · 전기승용 전체 기준</div></div><div class="region-card" id="regionCard"></div></section>

<script>
const APP_SESSION_KEY='es90_cdsid_session';
const SUBSIDY_RETURN_STATE_KEY='es90_subsidy_return_state';
const SUBSIDY_LAST_LOCATION_KEY='es90_subsidy_last_location';
const APP_SESSION_EXTENSION=60*60*1000;
const SELECTABLE_CITY_REGIONS=new Set([
  '서울특별시','부산광역시','대구광역시','인천광역시',
  '광주광역시','대전광역시','울산광역시','세종특별자치시'
]);
const TRIMS=[
  {trim:'Single Motor Plus',air:false,label:'Single Motor ER Plus',priceWon:72940000},
  {trim:'Single Motor Ultra',air:false,label:'Single Motor ER Ultra · No Air Sus',priceWon:80550000},
  {trim:'Single Motor Ultra',air:true,label:'Single Motor ER Ultra · Air Sus',priceWon:83410000},
  {trim:'Twin Motor Plus',air:false,label:'Twin Motor Plus',priceWon:79600000},
  {trim:'Twin Motor Ultra',air:false,label:'Twin Motor Ultra · No Air Sus',priceWon:87410000},
  {trim:'Twin Motor Ultra',air:true,label:'Twin Motor Ultra · Air Sus',priceWon:90410000},
  {trim:'Twin Motor Performance Ultra',air:false,label:'Twin Performance Ultra',priceWon:95410000}
];
const ES90_ESTIMATED_NATIONAL_MANWON=328;
const ES90_ESTIMATED_METRO_LOCAL_MANWON=98;
const OFFICIAL_SUBSIDY_PAYMENT_URL='https://ev.or.kr/nportal/buySupprt/initSubsidyPaymentCheckAction.do';
const OFFICIAL_MODEL_SUBSIDY_URL='https://ev.or.kr/nportal/buySupprt/initPsLocalCarPirceAction.do';
let subsidyData={regions:[]},selectedRecord=null,returnState=null,lastSubsidyRefreshAt=0,lastRenderedResultKey='';
const province=document.getElementById('province'),trimSelect=document.getElementById('trimSelect'),trimPicker=document.getElementById('trimPicker'),trimPickerTrigger=document.getElementById('trimPickerTrigger'),trimPickerMenu=document.getElementById('trimPickerMenu'),trimPickerSelected=document.getElementById('trimPickerSelected'),trimPickerBadge=document.getElementById('trimPickerBadge');
const fmt=n=>Number(n||0).toLocaleString('ko-KR');
const fmtManwon=n=>`${fmt(Math.round(n/10000))}만원`;
const pct=n=>`${Math.max(0,Math.min(100,n)).toFixed(1)}%`;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const koreanSort=(a,b)=>String(a).localeCompare(String(b),'ko');

function keepAppSessionAlive(){try{const session=JSON.parse(localStorage.getItem(APP_SESSION_KEY)||'null');if(session)localStorage.setItem(APP_SESSION_KEY,JSON.stringify({...session,expiresAt:Date.now()+APP_SESSION_EXTENSION}))}catch(_){}}
['pointerdown','keydown','touchstart','scroll'].forEach(type=>addEventListener(type,keepAppSessionAlive,{passive:true}));
keepAppSessionAlive();setInterval(keepAppSessionAlive,30000);
function notice(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(notice.t);notice.t=setTimeout(()=>t.classList.remove('show'),2100)}
function goBack(){keepAppSessionAlive();location.href='./app.html?returnStep=3&returnSource=subsidy'}
function logoutToLogin(){if(!confirm('로그아웃하고 로그인 화면으로 이동하시겠습니까?'))return;localStorage.removeItem(APP_SESSION_KEY);sessionStorage.removeItem(SUBSIDY_RETURN_STATE_KEY);location.href='./app.html'}

function eligibilityRate(trim){return hasHalfSubsidy(trim)?0.5:0}
function estimatedSubsidy(trim){
  if(!hasHalfSubsidy(trim))return {national:0,local:0};
  if(trim.trim.startsWith('Twin Motor'))return {national:165,local:50};
  return {national:Math.round(ES90_ESTIMATED_NATIONAL_MANWON*0.5),local:Math.round(ES90_ESTIMATED_METRO_LOCAL_MANWON*0.5)};
}
function subsidyPriceRange(trim){if(!hasHalfSubsidy(trim))return {tone:'none',range:'Twin Performance Ultra',result:'국가 및 지자체 보조금 지급대상 제외'};return {tone:'half',range:'ES90 보조금 추정 기준',result:'국가 및 지자체 보조금 50% 적용 예상'}}
function findOfficialModel(trim){
  const models=(subsidyData.modelStatus?.officialModels||[]).map(model=>({...model,key:String(model.modelName||'').toLowerCase()}));
  if(!models.length)return null;
  if(trim.trim.includes('Performance'))return models.find(model=>/performance|perf/.test(model.key))||null;
  if(trim.trim.startsWith('Single'))return models.find(model=>/single/.test(model.key)&&!/twin/.test(model.key))||(models.length===1?models[0]:null);
  if(trim.trim.startsWith('Twin'))return models.find(model=>/twin/.test(model.key)&&!/performance|perf/.test(model.key))||(models.length===1?models[0]:null);
  return models.length===1?models[0]:null;
}
function readReturnState(){try{const saved=JSON.parse(sessionStorage.getItem(SUBSIDY_RETURN_STATE_KEY)||localStorage.getItem(SUBSIDY_RETURN_STATE_KEY)||'null'),params=new URLSearchParams(location.search),urlTrim=params.get('es90Trim'),urlAir=params.get('airSuspension');returnState=urlTrim?{...(saved||{}),es90Trim:urlTrim,airSuspension:urlAir==='1'}:saved}catch(_){returnState=null}}
function hasHalfSubsidy(trim){return !trim.trim.includes('Performance')}
function closeTrimPicker(){trimPicker.classList.remove('open');trimPickerTrigger.setAttribute('aria-expanded','false')}
function updateTrimPicker(){const index=Math.max(0,Number(trimSelect.value)||0),trim=TRIMS[index],eligible=hasHalfSubsidy(trim);trimPickerSelected.textContent=`${trim.label} · ${fmtManwon(trim.priceWon)}`;trimPickerBadge.hidden=!eligible;trimPickerMenu.querySelectorAll('.trim-option').forEach((option,i)=>{const selected=i===index;option.classList.toggle('selected',selected);option.setAttribute('aria-selected',String(selected))})}
function selectTrimOption(index){trimSelect.value=String(index);updateTrimPicker();closeTrimPicker();resetSelection(currentPreviewStage())}
function fillTrims(){trimSelect.innerHTML=TRIMS.map((t,i)=>`<option value="${i}">${esc(t.label)} · ${fmtManwon(t.priceWon)}${hasHalfSubsidy(t)?' · 보조금 50% 적용':''}</option>`).join('');trimPickerMenu.innerHTML=TRIMS.map((t,i)=>`<button class="trim-option" type="button" role="option" aria-selected="false" onclick="selectTrimOption(${i})"><span class="trim-option-main">${esc(t.label)} · ${fmtManwon(t.priceWon)}</span>${hasHalfSubsidy(t)?'<span class="trim-option-subsidy" title="보조금 50% 적용" aria-label="보조금 50% 적용"><span>보조금</span><b>50%</b><span>적용</span></span>':''}</button>`).join('');let index=TRIMS.findIndex(t=>t.trim===returnState?.es90Trim&&t.air===!!returnState?.airSuspension);if(index<0&&Number(returnState?.effectivePriceWon)>0)index=TRIMS.findIndex(t=>t.priceWon===Number(returnState.effectivePriceWon));if(index<0)index=2;trimSelect.value=String(index);updateTrimPicker()}
function prompt(label){return `<option value="" selected disabled>${label}</option>`}
function fillProvinces(selectedSido=''){if(!selectedSido)localStorage.removeItem(SUBSIDY_LAST_LOCATION_KEY);const sidos=[...new Set(subsidyData.regions.map(x=>x.sido).filter(sido=>SELECTABLE_CITY_REGIONS.has(sido)))].sort(koreanSort);province.innerHTML=prompt('서울특별시 포함 8대 광역시 선택')+sidos.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('');province.value=sidos.includes(selectedSido)?selectedSido:'';selectedRecord=null}
province.onchange=()=>{selectedRecord=null;lastRenderedResultKey=''};trimSelect.onchange=()=>{updateTrimPicker();resetSelection(currentPreviewStage())};trimPickerTrigger.onclick=()=>{const open=!trimPicker.classList.contains('open');trimPicker.classList.toggle('open',open);trimPickerTrigger.setAttribute('aria-expanded',String(open))};document.addEventListener('pointerdown',event=>{if(!trimPicker.contains(event.target))closeTrimPicker()});document.addEventListener('keydown',event=>{if(event.key==='Escape')closeTrimPicker()});

function currentPreviewStage(){return province.value?'region':'initial'}
function resetSelection(stage=currentPreviewStage()){selectedRecord=null;lastRenderedResultKey='';renderPreview(stage)}
function renderEmpty(){renderPreview('initial')}
function renderPreview(stage='initial'){
  document.getElementById('waterfallWrap').className='waterfall-wrap';
  const trim=TRIMS[Number(trimSelect.value)||0],price=Math.round(trim.priceWon/10000),place=province.value?province.value:'서울특별시 포함 8대 광역시 선택 전';
  const steps={initial:{n:64,l:38,rate:34,cue:'지역을 선택하면 도형이 움직이며 계산 준비를 시작합니다.'},region:{n:96,l:54,rate:62,cue:'보조금 계산을 누르면 실제 보조금과 구매가가 채워집니다.'}},step=steps[stage]||steps.initial,finalY=36+step.n+step.l,finalH=Math.max(42,260-finalY);
  document.getElementById('waterfallWrap').innerHTML=`
  <div class="preview-panel"><div class="selection-line preview"><div><div class="selection-name">${esc(trim.label)} · ${fmt(price)}만원</div><div class="preview-copy">${esc(place)}</div></div><span class="eligibility preview">계산 대기</span></div>
  <div class="price-range preview"><div class="price-range-main"><span class="price-range-tag">미리보기</span><b>예상 구매가 계산 구조</b><strong class="preview-cue">${esc(step.cue)}</strong></div><small>도형은 화면 구성을 안내하는 기본 형태이며, 계산 전에는 실제 금액을 표시하지 않습니다.</small></div>
  <div class="wf-box preview preview-stage-${stage}"><div class="wf-focus-chip">보조금 계산 전</div><svg viewBox="0 0 760 310" role="img" aria-label="보조금 계산 전 예상 구매가 시뮬레이션 기본 도형">
    <defs><linearGradient id="wfPreviewBase" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#9db1bd"/><stop offset="100%" stop-color="#607d8e"/></linearGradient><linearGradient id="wfPreviewStep" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#d7e0e5"/><stop offset="100%" stop-color="#aab9c2"/></linearGradient><linearGradient id="wfPreviewFinal" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#bad0c2"/><stop offset="100%" stop-color="#6f9680"/></linearGradient><filter id="wfPreviewShadow" x="-14%" y="-10%" width="128%" height="128%"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#102a43" flood-opacity=".09"/></filter></defs>
    <line class="wf-axis" x1="35" y1="260" x2="725" y2="260"/>
    <rect class="wf-preview-bar" x="55" y="36" width="110" height="224" rx="5" fill="url(#wfPreviewBase)"/><text class="wf-preview-value" x="110" y="58">—</text>
    <line class="wf-preview-connector" x1="165" y1="36" x2="250" y2="36"/><rect class="wf-preview-bar" x="250" y="36" width="92" height="${step.n}" rx="5" fill="url(#wfPreviewStep)"/><text class="wf-preview-value" x="296" y="${36+step.n+18}">—</text>
    <line class="wf-preview-connector" x1="342" y1="${36+step.n}" x2="430" y2="${36+step.n}"/><rect class="wf-preview-bar" x="430" y="${36+step.n}" width="92" height="${step.l}" rx="5" fill="url(#wfPreviewStep)"/><text class="wf-preview-value" x="476" y="${36+step.n+step.l+18}">—</text>
    <line class="wf-preview-connector" x1="522" y1="${finalY}" x2="595" y2="${finalY}"/><rect class="wf-preview-bar" x="595" y="${finalY}" width="110" height="${finalH}" rx="5" fill="url(#wfPreviewFinal)"/><text class="wf-preview-value" x="650" y="${Math.min(252,finalY+22)}">—</text>
    <text class="wf-preview-label" x="110" y="288">ES90 출고가</text><text class="wf-preview-label" x="296" y="288">국가 보조금</text><text class="wf-preview-label" x="476" y="288">지자체 보조금</text><text class="wf-preview-label" x="650" y="288">예상 구매가</text>
  </svg></div>
  <div class="formula"><div class="formula-card preview"><span>ES90 출고가</span><b>—</b></div><div class="formula-card preview"><span>국가 보조금(추정치)</span><b>—</b></div><div class="formula-card preview"><span>지자체 보조금(추정치)</span><b>—</b></div><div class="formula-card preview final"><span>예상 구매가(추정치)</span><b>—</b></div></div></div>`;
  document.getElementById('regionCard').className='region-card preview';
  document.getElementById('regionCard').innerHTML=`
  <div class="region-status"><div><div class="region-status-name">${esc(place)}</div><div class="metric-sub">선택지역 보조금 소진 현황 미리보기</div></div><span class="status-badge preview">계산 전</span></div>
  ${regionMetricsMarkup(null,true)}
  <div class="region-donut-block"><div class="region-donut preview" style="--preview-rate:${step.rate}"><div class="region-donut-center"><span>공고대수</span><b>—대</b></div></div><div class="region-donut-legend"><div class="donut-row used"><i class="donut-dot used"></i><div class="donut-copy"><span>출고완료대수</span><b>—대</b></div><strong class="donut-rate">—%</strong></div><div class="donut-row remaining"><i class="donut-dot remaining"></i><div class="donut-copy"><span>출고잔여대수</span><b>—대</b></div><strong class="donut-rate">—%</strong></div></div></div>
  <div class="method"><b>접수방법</b><br>${stage==='region'?'보조금 계산을 누르면 선택지역의 접수방법이 표시됩니다.':'서울특별시 포함 8대 광역시 중 고객 거주지역을 선택해 주세요.'}</div>
  <div class="preview-source"><a href="${OFFICIAL_SUBSIDY_PAYMENT_URL}" target="_blank" rel="noopener noreferrer external">공식 지급현황</a><a href="${OFFICIAL_MODEL_SUBSIDY_URL}" target="_blank" rel="noopener noreferrer external">공식 차종별 보조금</a></div>
  <div class="preview-legal"><strong>대수 기준 안내</strong><span>접수대수는 신청부터 접수 완료 내역까지, 출고대수는 차량 출고에 따라 지원금 지급을 신청한 내역 기준입니다. 출고잔여 대수는 공고대수에서 출고대수를 제외한 값으로, 접수내역이나 예산 등 사유로 실제 신청 가능한 대수와 다를 수 있습니다.<br>접수·출고·출고잔여 대수는 민간구매 대수만 표시합니다.</span></div>`
}

function resultRenderKey(record){return [province.value,trimSelect.value,record.announced,record.received,record.selected,record.delivered,record.selectionRemaining,record.remaining,record.notice,record.applicationMethod].join('|')}
function showSubsidy(isBackgroundRefresh=false){if(!province.value){notice('고객 거주지역을 먼저 선택해 주세요.');return}const record=subsidyData.regions.find(x=>x.sido===province.value);if(!record){notice('선택지역 데이터를 찾지 못했습니다.');return}selectedRecord=record;const renderKey=resultRenderKey(record);if(isBackgroundRefresh&&renderKey===lastRenderedResultKey)return;renderSelected(record,!isBackgroundRefresh);lastRenderedResultKey=renderKey}
function renderSelected(record,animate=false){const useRate=record.announced?record.delivered/record.announced*100:0;document.getElementById('waterfallWrap').className=`waterfall-wrap${animate?'':' result-static'}`;document.getElementById('regionCard').className=`region-card${animate?'':' result-static'}`;renderWaterfall(record);renderRegion(record,useRate)}

function renderWaterfall(record){
  const trim=TRIMS[Number(trimSelect.value)||0],rate=eligibilityRate(trim);
  const {national,local}=estimatedSubsidy(trim);
  const price=Math.round(trim.priceWon/10000),final=Math.max(0,price-national-local),totalSubsidy=national+local,focusFloor=totalSubsidy?Math.max(0,Math.round(final-totalSubsidy*1.8)):0,scale=totalSubsidy?240/Math.max(1,price-focusFloor):240/Math.max(1,price),nH=totalSubsidy?national*scale:0,lH=totalSubsidy?local*scale:0,finalY=20+nH+lH,finalH=totalSubsidy?Math.max(18,(final-focusFloor)*scale):240,badge=rate?`${Math.round(rate*100)}% 보조금 적용`:'보조금 대상 아님',priceRange=subsidyPriceRange(trim),focusLabel=totalSubsidy?`가격 구간 확대 · ${fmt(focusFloor)}~${fmt(price)}만원`:'전체 가격 기준';
  const warning=rate===0?'Twin Performance Ultra는 국가 및 지자체 보조금 계산에서 제외됩니다.':'ES90 공식 차종별 보조금 확정 전 추정치이며, 실제 지급액은 공식 고시와 지자체 공고에 따라 달라질 수 있습니다.';
  const nationalLabel='국가 보조금(추정치)',localLabel='지자체 보조금(추정치)';
  document.getElementById('waterfallWrap').innerHTML=`
  <div class="selection-line"><div><div class="selection-name">${esc(trim.label)} · ${fmt(price)}만원</div><div class="preview-copy selection-line-spacer" aria-hidden="true">&nbsp;</div></div><span class="eligibility ${rate?'':'none'}">${badge}</span></div>
  <div class="price-range ${priceRange.tone}"><div class="price-range-main"><span class="price-range-tag">가격 구간</span><b>${esc(priceRange.range)}</b><strong>${esc(priceRange.result)}</strong></div><small>${esc(warning)}</small></div>
  <div class="wf-box"><div class="wf-focus-chip">${focusLabel}</div><svg viewBox="0 0 760 310" role="img" aria-label="출고가 주변 가격 구간을 확대하여 국비와 지방비 차감 효과를 보여주는 예상 구매가 시뮬레이션 그래프">
    <defs><linearGradient id="wfBaseGradient" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#5f8da8"/><stop offset="32%" stop-color="#356984"/><stop offset="68%" stop-color="#174660"/><stop offset="100%" stop-color="#082b42"/></linearGradient><linearGradient id="wfNationalGradient" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#bac5cc"/><stop offset="34%" stop-color="#9cabb5"/><stop offset="70%" stop-color="#7e919e"/><stop offset="100%" stop-color="#657986"/></linearGradient><linearGradient id="wfLocalGradient" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#cec7c0"/><stop offset="34%" stop-color="#b5aba2"/><stop offset="70%" stop-color="#9e9187"/><stop offset="100%" stop-color="#877a70"/></linearGradient><linearGradient id="wfFinalGradient" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#92c1a2"/><stop offset="32%" stop-color="#69a17c"/><stop offset="68%" stop-color="#447b5d"/><stop offset="100%" stop-color="#285d46"/></linearGradient><filter id="wfBarShadow" x="-14%" y="-10%" width="128%" height="128%"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#102a43" flood-opacity=".13"/></filter></defs>
    <line class="wf-axis" x1="35" y1="260" x2="725" y2="260"/>
    <rect class="wf-bar wf-base" x="55" y="20" width="110" height="240" rx="5" fill="url(#wfBaseGradient)"/><text class="wf-value light" x="110" y="42">${fmt(price)}만원</text>
    <line class="wf-connector" x1="165" y1="20" x2="250" y2="20"/><rect class="wf-bar wf-national" x="250" y="20" width="92" height="${nH}" rx="5"/><text class="wf-value" x="296" y="${Math.min(295,Math.max(16,20+nH+18))}">−${fmt(national)}만원</text>
    <line class="wf-connector" x1="342" y1="${20+nH}" x2="430" y2="${20+nH}"/><rect class="wf-bar wf-local" x="430" y="${20+nH}" width="92" height="${lH}" rx="5"/><text class="wf-value" x="476" y="${Math.min(295,Math.max(16,20+nH+lH+18))}">−${fmt(local)}만원</text>
    <line class="wf-connector" x1="522" y1="${finalY}" x2="595" y2="${finalY}"/><rect class="wf-bar wf-final" x="595" y="${finalY}" width="110" height="${finalH}" rx="5" fill="url(#wfFinalGradient)"/><text class="wf-value light" x="650" y="${Math.min(252,finalY+22)}">${fmt(final)}만원</text>
    <text class="wf-label" x="110" y="288">ES90 출고가</text><text class="wf-label" x="296" y="288">국가 보조금</text><text class="wf-label" x="476" y="288">지자체 보조금</text><text class="wf-label" x="650" y="288">예상 구매가</text>
  </svg></div>
  <div class="formula"><div class="formula-card"><span>ES90 출고가</span><b>${fmt(price)}만원</b></div><div class="formula-card minus"><span>${nationalLabel}</span><b>− ${fmt(national)}만원</b></div><div class="formula-card minus"><span>${localLabel}</span><b>− ${fmt(local)}만원</b></div><div class="formula-card final"><span>예상 구매가(추정치)</span><b>${fmt(final)}만원</b></div></div>`}

const REGION_METRIC_DEFS=[['공고','announced',''],['접수','received',''],['선정','selected',''],['출고','delivered',''],['선정잔여','selectionRemaining','is-selection-remaining'],['출고잔여','remaining','is-delivery-remaining']];
function regionMetricsMarkup(record,preview=false){return `<div class="region-metrics">${REGION_METRIC_DEFS.map(([label,key,tone])=>`<div class="region-metric ${tone}"><span class="region-metric-label">${label}</span><b class="region-metric-value">${preview?'—':fmt(Number(record?.[key])||0)}<small>대</small></b></div>`).join('')}</div>`}
function renderRegion(record,useRate){const available=record.remaining>0,remainingRate=record.announced?record.remaining/record.announced*100:0,safeUseRate=Math.max(0,Math.min(100,useRate));document.getElementById('regionCard').innerHTML=`
  <div class="region-status"><div><div class="region-status-name">${esc(record.sido)}</div><div class="metric-sub">${esc(record.notice||'공고 확인')}</div></div><span class="status-badge ${available?'':'empty'}">${available?'출고잔여대수 있음':'출고잔여대수 0대'}</span></div>
  ${regionMetricsMarkup(record)}
  <div class="region-donut-block"><div class="region-donut" style="--use-rate:${safeUseRate}"><div class="region-donut-center"><span>공고대수</span><b>${fmt(record.announced)}대</b></div></div><div class="region-donut-legend"><div class="donut-row used"><i class="donut-dot used"></i><div class="donut-copy"><span>출고완료대수</span><b>${fmt(record.delivered)}대</b></div><strong class="donut-rate">${pct(useRate)}</strong></div><div class="donut-row remaining"><i class="donut-dot remaining"></i><div class="donut-copy"><span>출고잔여대수</span><b>${fmt(record.remaining)}대</b></div><strong class="donut-rate">${pct(remainingRate)}</strong></div></div></div>
  <div class="method"><b>접수방법</b><br>${esc(record.applicationMethod||'공고문 확인 필요')}</div>
  <div class="source-links"><a href="${esc(subsidyData.source?.paymentUrl||OFFICIAL_SUBSIDY_PAYMENT_URL)}" target="_blank" rel="noopener noreferrer external">공식 지급현황 확인</a><a href="${esc(subsidyData.source?.priceUrl||OFFICIAL_MODEL_SUBSIDY_URL)}" target="_blank" rel="noopener noreferrer external">공식 차종별 보조금</a></div>
  <div class="legal-note"><strong>대수 기준 안내</strong><span>접수대수는 신청부터 접수 완료 내역까지, 출고대수는 차량 출고에 따라 지원금 지급을 신청한 내역 기준입니다. 출고잔여 대수는 공고대수에서 출고대수를 제외한 값으로, 접수내역이나 예산 등 사유로 실제 신청 가능한 대수와 다를 수 있습니다.<br>접수·출고·출고잔여 대수는 민간구매 대수만 표시합니다.</span></div>`}

function formatSeoulDate(value){const d=new Date(value);if(Number.isNaN(d.getTime()))return '-';const parts=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(d);const get=type=>parts.find(part=>part.type===type)?.value||'';return `${get('year')}-${get('month')}-${get('day')} ${get('hour')}:${get('minute')}`}
async function refreshSubsidyData(preserveSelection=true){if(Date.now()-lastSubsidyRefreshAt<15000)return;lastSubsidyRefreshAt=Date.now();const previousSido=preserveSelection?province.value:'',hadResult=!!selectedRecord,[dataResponse,versionResponse]=await Promise.all([fetch(`./subsidy-data.json?ts=${Date.now()}`,{cache:'no-store'}),fetch(`./version.json?ts=${Date.now()}`,{cache:'no-store'})]);if(!dataResponse.ok)throw new Error('보조금 데이터를 불러오지 못했습니다.');subsidyData=await dataResponse.json();const version=versionResponse.ok?await versionResponse.json():{};const checked=version.subsidyCheckedAt||subsidyData.checkedAt;document.getElementById('freshnessText').textContent=`${formatSeoulDate(checked)} 기준`;if(version.matrixUpdatedAt){const d=new Date(version.matrixUpdatedAt);document.getElementById('matrixUpdatedDate').textContent=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit'}).format(d)}fillProvinces(previousSido);if(province.value&&hadResult)showSubsidy(true)}
async function load(){readReturnState();fillTrims();renderEmpty();await refreshSubsidyData(false);setInterval(()=>refreshSubsidyData(true).catch(()=>{}),60000);addEventListener('focus',()=>refreshSubsidyData(true).catch(()=>{}));document.addEventListener('visibilitychange',()=>{if(!document.hidden)refreshSubsidyData(true).catch(()=>{})})}
load().catch(error=>{notice(error.message);document.getElementById('freshnessText').textContent='데이터 확인 필요'});
</script>
</body>
