<main>
  <section class="overview"><div class="overview-copy"><div class="kicker">EV SUBSIDY DASHBOARD</div><h1>ES90 보조금 한눈에 보기</h1><p>7개 트림 예상 보조금과 서울 포함 8대 광역시의 예산 현황</p></div><div class="overview-tools"><div class="freshness" title="보조금 데이터 업데이트 시각"><span class="freshness-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3.2 2"/></svg></span><span class="freshness-copy"><span class="freshness-label">UPDATE</span><span class="freshness-time" id="freshnessText">확인 중</span></span></div></div></section>
  <section class="panel"><div class="panel-head"><div class="panel-title"><span class="num">1</span>ES90 트림별 예상 보조금</div><div class="panel-note">지방비는 서울 포함 8개 도시의 최소~최대 예상 범위</div></div><div class="trim-grid" id="trimGrid"><div class="loading">트림 정보를 불러오는 중입니다.</div></div></section>
  <section class="panel city-panel"><div class="panel-head"><div class="panel-title"><span class="num">2</span>8대 광역시 예산 현황</div><div class="panel-note">선정 기준 · 전기승용 민간구매</div></div><div class="city-grid" id="cityGrid"><div class="loading">공식 데이터를 불러오는 중입니다.</div></div><div class="basis"><span><b>남은 대수</b>는 공식 선정잔여 기준이며 실제 신청 가능 대수와 다를 수 있습니다.</span><span class="basis-source">무공해차 통합누리집</span></div></section>
</main>

<script>
const APP_SESSION_KEY='es90_app_session_v1',APP_SESSION_EXTENSION=12*60*60*1000,OFFICIAL_URL='https://ev.or.kr/nportal/buySupprt/initSubsidyPaymentCheckAction.do';
const CITY_ORDER=['서울특별시','부산광역시','대구광역시','인천광역시','광주광역시','대전광역시','울산광역시','세종특별자치시'];
const TRIMS=[{name:'Single ER Plus',price:7294,type:'single'},{name:'Single ER Ultra',price:8055,type:'single'},{name:'Single ER Ultra · Air Sus.',price:8341,type:'single'},{name:'Twin Plus',price:7960,type:'twin'},{name:'Twin Ultra',price:8741,type:'twin'},{name:'Twin Ultra · Air Sus.',price:9041,type:'twin'},{name:'Twin Performance Ultra',price:9541,type:'performance'}];
let subsidyData={regions:[]},lastRefreshAt=0;
const fmt=value=>new Intl.NumberFormat('ko-KR').format(Number(value)||0),pct=value=>`${(Number(value)||0).toFixed(1)}%`,esc=value=>String(value??'').replace(/[&<>'"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch]));

function goBack(){keepAppSessionAlive();location.href='./app.html?returnStep=3&returnSource=subsidy'}
function logoutToLogin(){if(!confirm('로그아웃하고 로그인 화면으로 이동하시겠습니까?'))return;localStorage.removeItem(APP_SESSION_KEY);location.href='./app.html'}
function formatSeoulDate(value){const date=new Date(value);if(Number.isNaN(date.getTime()))return '확인 필요';const parts=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(date);const get=type=>parts.find(part=>part.type===type)?.value||'';return `${get('year')}-${get('month')}-${get('day')} ${get('hour')}:${get('minute')}`}
function formatMatrixDate(value){const date=new Date(value);if(Number.isNaN(date.getTime()))return '';const parts=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(date);const get=type=>parts.find(part=>part.type===type)?.value||'';return `${get('year')}-${get('month')}-${get('day')}`}

function searchIcon(){return '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 4 4"/></svg>'}
const CITY_MAP_MARKS={
  '서울특별시':{x:20.8,y:18.2,rx:3.5,ry:3.1},
  '부산광역시':{x:36.1,y:48.8,rx:3.8,ry:3.2},
  '대구광역시':{x:32.4,y:38.4,rx:3.8,ry:3.5},
  '인천광역시':{x:16.6,y:20.3,rx:3.8,ry:3.3},
  '광주광역시':{x:20.4,y:45.8,rx:3.8,ry:3.5},
  '대전광역시':{x:24.5,y:33.5,rx:3.6,ry:3.3},
  '울산광역시':{x:38.4,y:42.3,rx:3.7,ry:3.5},
  '세종특별자치시':{x:23.2,y:29.2,rx:3.4,ry:3.8}
};
function cityMapSvg(sido){const mark=CITY_MAP_MARKS[sido]||{x:25,y:33,rx:3.5,ry:3.5};return `<span class="city-map" title="대한민국 내 ${esc(sido)} 위치"><svg viewBox="0 0 52 68" role="img" aria-label="대한민국 지도에서 ${esc(sido)} 강조"><path class="korea-land" d="M29 2c-3 4-2 8-6 11-3 3-3 7-6 10-3 4 0 7-2 11-1 4 2 7 2 11 0 5 3 8 5 12 3 5 7 7 10 3 3-3 3-7 7-10 4-3 2-7 4-11 2-5-2-8-2-12 0-4-4-7-4-11 0-4-4-7-5-10-1-3-3-6-6-4Z"/><ellipse class="korea-island" cx="23.5" cy="64" rx="6" ry="2.1"/><ellipse class="region-highlight-ring" cx="${mark.x}" cy="${mark.y}" rx="${mark.rx+2.2}" ry="${mark.ry+2.2}"/><ellipse class="region-highlight" cx="${mark.x}" cy="${mark.y}" rx="${mark.rx}" ry="${mark.ry}"/></svg></span>`}
function renderTrims(regions){document.getElementById('trimGrid').innerHTML=TRIMS.map(trim=>{if(trim.type==='performance')return `<article class="trim-card performance"><div class="trim-name">${esc(trim.name)}</div><div class="trim-price">${fmt(trim.price)}<small>만원</small></div><div class="trim-subsidy"><span class="no-subsidy">보조금 없음</span></div></article>`;const locals=regions.map(region=>trimLocal(trim,region)),localMin=Math.min(...locals),localMax=Math.max(...locals);return `<article class="trim-card"><div class="trim-name">${esc(trim.name)}</div><div class="trim-price">${fmt(trim.price)}<small>만원</small></div><div class="trim-subsidy"><span class="money-pill">국비 ${fmt(trimNational(trim))}</span><span class="money-pill local">지방비 ${fmt(localMin)}~${fmt(localMax)}</span></div></article>`}).join('')}
function cityCard(region){const announced=Number(region.announced)||0,selected=Number(region.selected)||0,remaining=Math.max(0,Number(region.selectionRemaining)||0),burn=announced?Math.max(0,Math.min(100,selected/announced*100)):0,remain=announced?Math.max(0,Math.min(100,remaining/announced*100)):0,deadline=region.applicationDeadline||'공고 확인',url=subsidyData.source?.paymentUrl||OFFICIAL_URL;return `<article class="city-card"><div class="city-head"><div class="city-title-block"><div class="city-name">${esc(region.sido)}</div><div class="deadline">신청 마감 ${esc(deadline)}</div></div><div class="city-head-tools">${cityMapSvg(region.sido)}<a class="detail-link" href="${esc(url)}" target="_blank" rel="noopener noreferrer external" title="공식 데이터 참고" aria-label="${esc(region.sido)} 공식 데이터 참고">${searchIcon()}</a></div></div><div class="city-main"><div class="donut-chart" style="--use-rate:${burn}"><div class="donut-center"><span>공고 대수</span><b>${fmt(announced)}</b></div></div><div class="donut-stats"><div class="donut-stat"><span>소진율</span><b>${pct(burn)}</b></div><div class="donut-stat remaining"><span>잔여율</span><b>${pct(remain)}</b></div></div></div><div class="counts"><div class="count"><span>올해 공고</span><b>${fmt(announced)}대</b></div><div class="count"><span>선정 완료</span><b>${fmt(selected)}대</b></div><div class="count remaining"><span>남은 대수</span><b>${fmt(remaining)}대</b></div></div></article>`}
function renderCities(regions){document.getElementById('cityGrid').innerHTML=regions.map(cityCard).join('')}
function render(){const regions=orderedRegions();renderTrims(regions);renderCities(regions)}
async function refreshData(force=false){if(!force&&Date.now()-lastRefreshAt<15000)return;lastRefreshAt=Date.now();const stamp=Date.now(),[dataResponse,versionResponse]=await Promise.all([fetch(`./subsidy-data.json?ts=${stamp}`,{cache:'no-store'}),fetch(`./version.json?ts=${stamp}`,{cache:'no-store'})]);if(!dataResponse.ok)throw new Error('보조금 데이터를 불러오지 못했습니다.');subsidyData=await dataResponse.json();const version=versionResponse.ok?await versionResponse.json():{},candidates=[version.subsidyCheckedAt,subsidyData.checkedAt].filter(value=>!Number.isNaN(new Date(value).getTime())),checked=candidates.sort((a,b)=>new Date(b)-new Date(a))[0],matrixDate=formatMatrixDate(version.matrixUpdatedAt);document.getElementById('freshnessText').textContent=`${formatSeoulDate(checked)} 기준`;if(matrixDate)document.getElementById('matrixUpdatedDate').textContent=matrixDate;render()}
async function load(){keepAppSessionAlive();await refreshData(true);setInterval(()=>refreshData().catch(()=>{}),60000);addEventListener('focus',()=>refreshData(true).catch(()=>{}));document.addEventListener('visibilitychange',()=>{if(!document.hidden)refreshData(true).catch(()=>{})})}
load().catch(error=>{notice(error.message);document.getElementById('freshnessText').textContent='확인 필요'});
</script>
</body>
</html>
