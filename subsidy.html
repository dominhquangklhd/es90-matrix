<!doctype html>
<html lang="ko">
<head>

<link rel="preload" href="https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-5Medium.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:Paperlogy;src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-5Medium.woff2') format('woff2');font-weight:500;font-style:normal;font-display:optional}
:root{--deep:#071b2c;--navy:#11334b;--ink:#18364a;--muted:#71838e;--line:#d7e2e8;--line2:#e8eef2;--soft:#eef3f6;--paper:#fff;--orange:#ed6b3d;--orange-soft:#fff1eb;--green:#14946a;--green-soft:#eaf8f3;--blue:#357697;--shadow:0 6px 18px rgba(16,42,67,.06)}
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--soft);color:var(--ink);font-family:Paperlogy,-apple-system,BlinkMacSystemFont,"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;-webkit-font-smoothing:antialiased;letter-spacing:-.2px}button{font:inherit;cursor:pointer}a{color:inherit;text-decoration:none}
.top{height:44px;background:var(--deep);color:#fff}.top-in{height:100%;padding:0 14px;display:flex;align-items:center;justify-content:space-between;gap:12px}.back,.logout{height:28px;border:1px solid rgba(255,255,255,.24);border-radius:7px;background:rgba(255,255,255,.07);color:#fff;padding:0 10px;font-size:9px;font-weight:800}.top-brand{font-size:9px;color:rgba(255,255,255,.62)}.top-brand b{color:#fff;font-size:11px}.top-meta{display:flex;align-items:center;gap:8px;color:rgba(255,255,255,.54);font-size:8px}
main{height:calc(100dvh - 44px);padding:8px 12px;display:grid;grid-template-rows:72px 128px minmax(0,1fr);gap:8px;min-height:0}.overview{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:space-between;gap:18px;padding:10px 15px;border-radius:10px;background:linear-gradient(125deg,#09243a 0%,#174b68 72%,#26677f 100%);color:#fff;box-shadow:var(--shadow)}.overview:after{content:"";position:absolute;right:-70px;top:-132px;width:250px;height:250px;border:1px solid rgba(255,255,255,.14);border-radius:50%;box-shadow:0 0 0 35px rgba(255,255,255,.024)}.overview-copy{position:relative;z-index:1}.kicker{color:#ffad86;font-size:7px;font-weight:900;letter-spacing:1px}.overview h1{margin:3px 0 2px;font-size:22px;line-height:1.05;letter-spacing:-.8px}.overview p{margin:0;color:rgba(255,255,255,.64);font-size:8px}.overview-tools{position:relative;z-index:2;display:flex;align-items:center;gap:7px}.freshness,.source-link{display:inline-flex;align-items:center;gap:5px;height:25px;padding:0 8px;border-radius:999px;font-size:8px;font-weight:800;white-space:nowrap}.freshness{border:1px solid rgba(255,255,255,.28);background:rgba(7,27,44,.38);color:#e2edf3}.freshness strong{color:#ffb18e;font-size:7px}.source-link{border:1px solid rgba(255,255,255,.38);background:#fff;color:#177b5b}.source-link svg,.detail-link svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round}
.panel{min-height:0;overflow:hidden;border:1px solid var(--line);border-radius:10px;background:#fff;box-shadow:var(--shadow)}.panel-head{height:34px;padding:0 10px;display:flex;align-items:center;justify-content:space-between;gap:8px;border-bottom:1px solid var(--line2)}.panel-title{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:900}.num{display:grid;place-items:center;width:17px;height:17px;border-radius:6px;background:#e9f2f7;color:#2e6685;font-size:8px}.panel-note{color:var(--muted);font-size:7px}.trim-grid{height:calc(100% - 34px);padding:6px;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}.trim-card{min-width:0;padding:6px 7px;border:1px solid var(--line);border-radius:8px;background:#fbfcfd;display:grid;grid-template-rows:auto auto 1fr}.trim-card.performance{border-color:#efc1b1;background:#fff8f5}.trim-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#34566c;font-size:7px;font-weight:800}.trim-price{margin-top:2px;color:#153b54;font-size:15px;font-weight:900;font-variant-numeric:tabular-nums}.trim-price small{margin-left:1px;font-size:6px}.trim-subsidy{align-self:end;display:flex;align-items:center;gap:4px;color:#547080;font-size:7px}.money-pill{display:inline-flex;align-items:center;height:18px;padding:0 5px;border-radius:5px;background:#edf5fa;color:#246589;font-weight:900;white-space:nowrap}.money-pill.local{background:var(--green-soft);color:#0d7f5b}.no-subsidy{display:inline-flex;align-items:center;height:20px;padding:0 7px;border:1px solid #efa78d;border-radius:6px;background:#fff0ea;color:#bd4a24;font-size:7px;font-weight:900}
.city-panel{display:grid;grid-template-rows:34px minmax(0,1fr) 22px}.city-grid{min-height:0;padding:6px;display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px}.city-card{min-width:0;min-height:0;border:1px solid var(--line);border-radius:8px;background:#fff;display:grid;grid-template-rows:39px 34px minmax(0,1fr) 43px;overflow:hidden}.city-head{padding:6px 6px 4px;display:flex;align-items:flex-start;justify-content:space-between;gap:4px;border-bottom:1px solid var(--line2);background:#fafcfd}.city-name{font-size:10px;font-weight:900;color:#153a52;white-space:nowrap}.deadline{margin-top:2px;color:#7c8c96;font-size:6px;white-space:nowrap}.detail-link{display:grid;place-items:center;flex:0 0 auto;width:23px;height:23px;border:1px solid #48b792;border-radius:6px;color:#10805c;background:#fff}.rates{display:grid;grid-template-columns:1fr 1fr;gap:3px;padding:4px 5px 1px;text-align:center}.rate{min-width:0}.rate span{display:block;font-size:6px;color:#87949d}.rate b{display:block;margin-top:1px;font-size:15px;line-height:1;color:var(--orange);font-weight:950;font-variant-numeric:tabular-nums}.rate.remain b{color:var(--green)}
.bars{min-height:0;padding:4px 6px 3px;display:flex;align-items:flex-end;justify-content:center;gap:11px}.bar-set{height:100%;min-height:76px;display:grid;grid-template-rows:minmax(0,1fr) 12px;justify-items:center;gap:2px}.bar-track{position:relative;width:31px;height:100%;min-height:70px;overflow:hidden;border-radius:5px 5px 3px 3px;background:#f0f3f5;border:1px solid #e0e7eb}.bar-fill{position:absolute;left:0;right:0;bottom:0;min-height:0;border-radius:4px 4px 2px 2px;background:linear-gradient(180deg,#f3936e,#e85e2c)}.bar-fill.remaining{background:linear-gradient(180deg,#54ba94,#128863)}.bar-label{font-size:6px;color:#687d8a;font-weight:800}.counts{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;padding:4px 5px 5px;border-top:1px solid var(--line2);background:#fbfcfd}.count{min-width:0;text-align:center}.count span{display:block;color:#85939c;font-size:5.7px;white-space:nowrap}.count b{display:block;margin-top:2px;color:#1b4057;font-size:9px;font-weight:900;white-space:nowrap;font-variant-numeric:tabular-nums}.count.remaining b{color:var(--green)}.basis{padding:0 9px;display:flex;align-items:center;justify-content:space-between;gap:8px;border-top:1px solid var(--line2);background:#fbfcfd;color:#71838e;font-size:6.5px}.basis b{color:#365b70}.basis-source{color:#177b5b;font-weight:800;white-space:nowrap}.loading{grid-column:1/-1;display:grid;place-items:center;color:#738692;font-size:9px}
.toast{position:fixed;left:50%;bottom:14px;z-index:90;transform:translate(-50%,14px);opacity:0;padding:8px 12px;border-radius:8px;background:#14364c;color:#fff;font-size:8px;pointer-events:none;transition:.18s}.toast.show{transform:translate(-50%,0);opacity:1}
@property --donut-sweep{syntax:"<angle>";inherits:false;initial-value:0deg}.panel,.city-card{border-radius:6px}.city-grid{grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr))}.city-card{grid-template-rows:39px minmax(0,1fr) 43px;border-radius:6px}.city-main{min-height:0;padding:5px 8px;display:grid;grid-template-columns:104px minmax(0,1fr);align-items:center;gap:9px}.donut-chart{position:relative;width:96px;height:96px;margin:auto;border-radius:50%;background:#e8eef0;box-shadow:inset 0 0 0 1px rgba(16,42,67,.06);animation:donutReveal 1.13s cubic-bezier(.16,1,.3,1) both}.donut-chart:before{content:"";position:absolute;inset:0;border-radius:50%;background:linear-gradient(145deg,rgba(255,255,255,.34),rgba(8,43,66,.14)),conic-gradient(from 0deg,#f87842 0 calc(var(--use-rate)*1%),#4aaf86 calc(var(--use-rate)*1%) 100%);background-blend-mode:soft-light,normal;-webkit-mask:conic-gradient(from 0deg,#000 0 var(--donut-sweep),transparent var(--donut-sweep) 360deg);mask:conic-gradient(from 0deg,#000 0 var(--donut-sweep),transparent var(--donut-sweep) 360deg);animation:donutSequentialSweep 1.13s cubic-bezier(.16,1,.3,1) both}.donut-chart:after{content:"";position:absolute;inset:23px;border:1px solid var(--line2);border-radius:50%;background:#fff;box-shadow:0 2px 8px rgba(16,42,67,.08)}.donut-center{position:absolute;inset:27px;z-index:1;display:grid;place-content:center;text-align:center;color:#748894;font-size:6px;line-height:1.2}.donut-center b{display:block;margin-top:2px;color:#183d55;font-size:12px;font-weight:900;font-variant-numeric:tabular-nums}.donut-stats{min-width:0;display:grid;gap:5px}.donut-stat{min-width:0;padding:6px 8px;border-radius:6px;background:var(--orange-soft);display:flex;align-items:center;justify-content:space-between;gap:5px}.donut-stat.remaining{background:var(--green-soft)}.donut-stat span{color:#9a5a43;font-size:7px}.donut-stat.remaining span{color:#407c67}.donut-stat b{color:var(--orange);font-size:17px;font-weight:950;font-variant-numeric:tabular-nums;white-space:nowrap}.donut-stat.remaining b{color:var(--green)}@keyframes donutReveal{0%{transform:scale(.94);opacity:.35}100%{transform:scale(1);opacity:1}}@keyframes donutSequentialSweep{0%{--donut-sweep:0deg}100%{--donut-sweep:360deg}}@media(prefers-reduced-motion:reduce){.donut-chart,.donut-chart:before{animation:none}.donut-chart:before{--donut-sweep:360deg}}
@media(max-width:1100px){.trim-name{font-size:6.2px}.trim-price{font-size:13px}.trim-subsidy{gap:2px}.money-pill{padding:0 3px}.city-name{font-size:9px}.deadline{font-size:5.6px}.city-main{grid-template-columns:88px minmax(0,1fr);gap:5px}.donut-chart{width:82px;height:82px}.donut-chart:after{inset:20px}.donut-center{inset:23px}.donut-center b{font-size:10px}.donut-stat{padding:5px 6px}.donut-stat b{font-size:14px}}
@media(max-width:959px),(max-height:650px){html,body{height:auto;min-height:100%;overflow:auto}main{height:auto;grid-template-rows:auto auto auto}.overview{min-height:78px}.trim-grid{grid-template-columns:repeat(4,minmax(0,1fr));height:auto}.trim-card{min-height:78px}.city-panel{display:block}.city-grid{grid-template-columns:repeat(4,minmax(0,1fr))}.city-card{height:300px}.basis{min-height:26px}}
@media(max-width:600px){.top-brand,.top-meta span{display:none}.overview{align-items:flex-start;flex-direction:column}.overview-tools{align-self:stretch;justify-content:space-between}.trim-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.city-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.panel-note{display:none}}
</style>
</head>
<body>
<header class="top"><div class="top-in"><button class="back" type="button" onclick="goBack()">← ES90 비교</button><div class="top-brand"><b>ES90</b> 전국 전기차 보조금</div><div class="top-meta"><span>Since <span id="matrixUpdatedDate">260722</span></span><button class="logout" type="button" onclick="logoutToLogin()">로그아웃</button></div></div></header>
<main>
  <section class="overview"><div class="overview-copy"><div class="kicker">EV SUBSIDY DASHBOARD</div><h1>ES90 보조금 한눈에 보기</h1><p>7개 트림 예상 보조금과 서울 포함 8대 광역시의 예산 현황</p></div><div class="overview-tools"><div class="freshness"><strong>UPDATE</strong><span id="freshnessText">확인 중</span></div><a class="source-link" id="officialTopLink" href="https://ev.or.kr/nportal/buySupprt/initSubsidyPaymentCheckAction.do" target="_blank" rel="noopener noreferrer external"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 4 4"/></svg>공식 데이터</a></div></section>
  <section class="panel"><div class="panel-head"><div class="panel-title"><span class="num">1</span>ES90 트림별 예상 보조금</div><div class="panel-note">지방비는 서울 포함 8개 도시의 최소~최대 예상 범위</div></div><div class="trim-grid" id="trimGrid"><div class="loading">트림 정보를 불러오는 중입니다.</div></div></section>
  <section class="panel city-panel"><div class="panel-head"><div class="panel-title"><span class="num">2</span>8대 광역시 예산 현황</div><div class="panel-note">선정 기준 · 전기승용 민간구매</div></div><div class="city-grid" id="cityGrid"><div class="loading">공식 데이터를 불러오는 중입니다.</div></div><div class="basis"><span><b>남은 대수</b>는 공식 선정잔여 기준이며 실제 신청 가능 대수와 다를 수 있습니다.</span><span class="basis-source">무공해차 통합누리집</span></div></section>
</main>
<div class="toast" id="toast" role="status"></div>
<script>
const APP_SESSION_KEY='es90_app_session_v1',APP_SESSION_EXTENSION=12*60*60*1000,OFFICIAL_URL='https://ev.or.kr/nportal/buySupprt/initSubsidyPaymentCheckAction.do';
const CITY_ORDER=['서울특별시','부산광역시','대구광역시','인천광역시','광주광역시','대전광역시','울산광역시','세종특별자치시'];
const TRIMS=[{name:'Single ER Plus',price:7294,type:'single'},{name:'Single ER Ultra',price:8055,type:'single'},{name:'Single ER Ultra · Air Sus.',price:8341,type:'single'},{name:'Twin Plus',price:7960,type:'twin'},{name:'Twin Ultra',price:8741,type:'twin'},{name:'Twin Ultra · Air Sus.',price:9041,type:'twin'},{name:'Twin Performance Ultra',price:9541,type:'performance'}];
let subsidyData={regions:[]},lastRefreshAt=0;
const fmt=value=>new Intl.NumberFormat('ko-KR').format(Number(value)||0),pct=value=>`${(Number(value)||0).toFixed(1)}%`,esc=value=>String(value??'').replace(/[&<>'"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch]));
function notice(message){const toast=document.getElementById('toast');toast.textContent=message;toast.classList.add('show');clearTimeout(notice.timer);notice.timer=setTimeout(()=>toast.classList.remove('show'),2200)}
function keepAppSessionAlive(){try{const session=JSON.parse(localStorage.getItem(APP_SESSION_KEY)||'null');if(session)localStorage.setItem(APP_SESSION_KEY,JSON.stringify({...session,expiresAt:Date.now()+APP_SESSION_EXTENSION}))}catch(_){}}
function goBack(){keepAppSessionAlive();location.href='./app.html?returnStep=3&returnSource=subsidy'}
function logoutToLogin(){if(!confirm('로그아웃하고 로그인 화면으로 이동하시겠습니까?'))return;localStorage.removeItem(APP_SESSION_KEY);location.href='./app.html'}
function formatSeoulDate(value){const date=new Date(value);if(Number.isNaN(date.getTime()))return '확인 필요';const parts=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Seoul',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(date);const get=type=>parts.find(part=>part.type===type)?.value||'';return `${get('month')}.${get('day')} ${get('hour')}:${get('minute')}`}
function trimNational(trim){if(trim.type==='performance')return 0;return trim.type==='twin'?165:164}
function trimLocal(trim,region){if(trim.type==='performance')return 0;const seoulEstimate=trim.type==='twin'?50:49,localMax=Number(region?.localMaxManwon)||194;return Math.max(0,Math.round(seoulEstimate*localMax/194))}
function orderedRegions(){const map=new Map((subsidyData.regions||[]).map(region=>[region.sido,region]));return CITY_ORDER.map(sido=>map.get(sido)||{sido,missing:true})}
function searchIcon(){return '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 4 4"/></svg>'}
function renderTrims(regions){document.getElementById('trimGrid').innerHTML=TRIMS.map(trim=>{if(trim.type==='performance')return `<article class="trim-card performance"><div class="trim-name">${esc(trim.name)}</div><div class="trim-price">${fmt(trim.price)}<small>만원</small></div><div class="trim-subsidy"><span class="no-subsidy">보조금 없음</span></div></article>`;const locals=regions.map(region=>trimLocal(trim,region)),localMin=Math.min(...locals),localMax=Math.max(...locals);return `<article class="trim-card"><div class="trim-name">${esc(trim.name)}</div><div class="trim-price">${fmt(trim.price)}<small>만원</small></div><div class="trim-subsidy"><span class="money-pill">국비 ${fmt(trimNational(trim))}</span><span class="money-pill local">지방비 ${fmt(localMin)}~${fmt(localMax)}</span></div></article>`}).join('')}
function cityCard(region){const announced=Number(region.announced)||0,selected=Number(region.selected)||0,remaining=Math.max(0,Number(region.selectionRemaining)||0),burn=announced?Math.max(0,Math.min(100,selected/announced*100)):0,remain=announced?Math.max(0,Math.min(100,remaining/announced*100)):0,deadline=region.applicationDeadline||'공고 확인',url=subsidyData.source?.paymentUrl||OFFICIAL_URL;return `<article class="city-card"><div class="city-head"><div><div class="city-name">${esc(region.sido)}</div><div class="deadline">마감 ${esc(deadline)}</div></div><a class="detail-link" href="${esc(url)}" target="_blank" rel="noopener noreferrer external" title="공식 데이터 참고" aria-label="${esc(region.sido)} 공식 데이터 참고">${searchIcon()}</a></div><div class="rates"><div class="rate"><span>소진율</span><b>${pct(burn)}</b></div><div class="rate remain"><span>잔여율</span><b>${pct(remain)}</b></div></div><div class="bars"><div class="bar-set"><div class="bar-track"><div class="bar-fill" style="height:${burn}%"></div></div><div class="bar-label">소진</div></div><div class="bar-set"><div class="bar-track"><div class="bar-fill remaining" style="height:${remain}%"></div></div><div class="bar-label">잔여</div></div></div><div class="counts"><div class="count"><span>공고</span><b>${fmt(announced)}</b></div><div class="count"><span>선정</span><b>${fmt(selected)}</b></div><div class="count remaining"><span>남은 대수</span><b>${fmt(remaining)}</b></div></div></article>`}
function renderCities(regions){document.getElementById('cityGrid').innerHTML=regions.map(cityCard).join('')}
function render(){const regions=orderedRegions();renderTrims(regions);renderCities(regions);document.getElementById('officialTopLink').href=subsidyData.source?.paymentUrl||OFFICIAL_URL}
async function refreshData(force=false){if(!force&&Date.now()-lastRefreshAt<15000)return;lastRefreshAt=Date.now();const stamp=Date.now(),[dataResponse,versionResponse]=await Promise.all([fetch(`./subsidy-data.json?ts=${stamp}`,{cache:'no-store'}),fetch(`./version.json?ts=${stamp}`,{cache:'no-store'})]);if(!dataResponse.ok)throw new Error('보조금 데이터를 불러오지 못했습니다.');subsidyData=await dataResponse.json();const version=versionResponse.ok?await versionResponse.json():{},candidates=[version.subsidyCheckedAt,subsidyData.checkedAt].filter(value=>!Number.isNaN(new Date(value).getTime())),checked=candidates.sort((a,b)=>new Date(b)-new Date(a))[0];document.getElementById('freshnessText').textContent=formatSeoulDate(checked);render()}
async function load(){keepAppSessionAlive();await refreshData(true);setInterval(()=>refreshData().catch(()=>{}),60000);addEventListener('focus',()=>refreshData(true).catch(()=>{}));document.addEventListener('visibilitychange',()=>{if(!document.hidden)refreshData(true).catch(()=>{})})}
load().catch(error=>{notice(error.message);document.getElementById('freshnessText').textContent='확인 필요'});
</script>
</body>
</html>
