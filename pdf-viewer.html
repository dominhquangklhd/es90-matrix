  <meta http-equiv="Pragma" content="no-cache">

  <script>
    if(window.top !== window.self){
      try{
        window.top.location.replace(window.location.href);
      }catch(_){/* same-origin ES90 shell에서만 실행되므로 정상 경로에서는 발생하지 않음 */}
    }
  </script>
  <style>
    :root{--navy:#163046;--navy-deep:#0d2538;--paper:#080d11}
    *{box-sizing:border-box}
    html{background-color:#080d11;color-scheme:dark}
    html,body{width:100vw;max-width:none;height:100%;min-height:100%;margin:0;overflow:hidden;background-color:#080d11;font-family:Arial,"Noto Sans KR",sans-serif;color:#fff}
    body{position:fixed;inset:0}
    html,body,.pdf-stage,.pdf-page{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
    @supports (height:100dvh){html,body{height:100dvh}}
    .pdf-back{position:fixed;z-index:30;top:calc(env(safe-area-inset-top) + 12px);right:calc(env(safe-area-inset-right) + 12px);display:grid;width:46px;height:46px;place-items:center;border:1px solid rgba(255,255,255,.34);border-radius:50%;background:rgba(13,37,56,.84);color:#fff;text-decoration:none;box-shadow:0 4px 16px rgba(0,0,0,.28);cursor:pointer;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);-webkit-tap-highlight-color:transparent}
    .pdf-back svg{display:block;width:23px;height:23px}
    .pdf-back:active{transform:scale(.96)}
    .pdf-back:focus-visible{outline:3px solid #ffb491;outline-offset:2px}
    .pdf-stage{position:fixed;inset:0;width:100vw;max-width:none;height:100vh;height:100dvh;overflow-y:auto;overflow-x:hidden;background:var(--paper);-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;scroll-behavior:smooth;scroll-snap-type:y mandatory}
    .pdf-stage{scrollbar-width:none}
    .pdf-stage::-webkit-scrollbar{display:none}
    .pdf-pages{width:100%;margin:0;padding:0;background:var(--paper)}
    .pdf-page{position:relative;display:grid;width:100%;height:100vh;height:100dvh;min-height:100vh;min-height:100dvh;margin:0;padding:0;place-items:center;overflow:hidden;background:var(--paper);scroll-snap-align:start;scroll-snap-stop:always}
    .pdf-page img{display:block;width:100%;height:100%;max-width:none;margin:0;object-fit:contain;object-position:center;pointer-events:none;-webkit-user-drag:none;user-drag:none}
    .pdf-page figcaption{position:absolute;right:calc(env(safe-area-inset-right) + 10px);bottom:calc(env(safe-area-inset-bottom) + 9px);padding:3px 7px;border-radius:999px;background:rgba(10,28,42,.72);color:#fff;font-size:9px;font-weight:700;line-height:1}
    .pdf-loading{position:fixed;z-index:10;inset:0;display:grid;place-items:center;background:#080d11;color:#9fb0bc;font-size:13px;font-weight:700;pointer-events:none;transition:opacity .2s ease,visibility .2s ease}
    .pdf-loading.is-hidden{visibility:hidden;opacity:0}
    @supports (-webkit-touch-callout:none){
      @media (min-width:768px) and (orientation:landscape){
        html,body{height:calc(100dvh + 32px);min-height:calc(100dvh + 32px)}
        body{bottom:-32px}
        .pdf-stage{height:calc(100dvh + 32px);bottom:-32px}
        .pdf-page{height:calc(100dvh + 32px);min-height:calc(100dvh + 32px)}
        .pdf-page figcaption{bottom:calc(41px + env(safe-area-inset-bottom,0px))}
      }
    }
    @media(prefers-reduced-motion:reduce){.pdf-stage{scroll-behavior:auto}}
  </style>
</head>
<body>
  <a class="pdf-back" href="/es90-matrix/app.html?returnStep=3&amp;returnSource=pdf" onclick="return exitPdfViewer(event)" aria-label="ES90 매트릭스로 돌아가기" title="ES90 매트릭스로 돌아가기">

  </main>
  <script>
    const blockViewerExport = event=>{
      event.preventDefault();
      event.stopPropagation();
    };
    document.addEventListener('contextmenu',blockViewerExport,{capture:true});
    document.addEventListener('dragstart',blockViewerExport,{capture:true});
    document.addEventListener('selectstart',blockViewerExport,{capture:true});
    document.addEventListener('keydown',event=>{
      const key = String(event.key || '').toLowerCase();
      const exportShortcut = (event.ctrlKey || event.metaKey) && ['s','p','u','c'].includes(key);
      if(exportShortcut || key === 'printscreen') blockViewerExport(event);
    },{capture:true});

    function exitPdfViewer(event){
      if(event) event.preventDefault();
      const fallback = '/es90-matrix/app.html?returnStep=3&returnSource=pdf';
      location.replace(fallback);
      return false;
    }
  </script>
